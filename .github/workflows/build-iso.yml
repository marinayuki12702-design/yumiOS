name: Build yumiOS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Dependencias básicas
        run: apt-get update && apt-get install -y git ca-certificates

      - uses: actions/checkout@v4

      - name: Construir la ISO
        run: bash ./build-yumios.sh

      - name: Calcular suma de verificación
        run: |
          cd yumios-build
          sha256sum yumiOS-*.iso > SHA256SUMS

      - name: Publicar la ISO en una Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yumios-${{ github.run_number }}
          name: yumiOS build ${{ github.run_number }}
          files: |
            yumios-build/yumiOS-*.iso
            yumios-build/SHA256SUMS
